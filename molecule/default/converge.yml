---
- name: Converge
  hosts: all
  vars:
    external_repos_epel: true
    # Cockpit optional packages are absent from the minimal test container.
    # Set at play level so it also applies to thbe.rhel when it is pulled in
    # as a meta dependency of thbe.security (not just the explicit include).
    cockpit_manage: false
  tasks:
    - name: "Include thbe.common"
      ansible.builtin.include_role:
        name: "thbe.common"
    - name: "Include thbe.rhel"
      ansible.builtin.include_role:
        name: "thbe.rhel"
    - name: "Include thbe.security"
      ansible.builtin.include_role:
        name: "thbe.security"
      vars:
        pass_max_days: 180
        pass_min_days: 10
        pass_min_len: 10
        pass_warn_age: 14
        remember: 12
        lynis_enable: true
        rkhunter_enable: true
